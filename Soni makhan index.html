<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soni Makhana | Premium Makhana</title>
<meta name="description" content="Soni Makhana - स्वादिष्ट और गुणवत्तापूर्ण मखाना। 1 kg से ऑर्डर करें। पूरे भारत में डिलीवरी।">
<style>
:root{--green:#0b4f2f;--dark:#123322;--gold:#d6a82e;--cream:#fffaf0;--light:#f5f8f4;--text:#243027;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;color:var(--text);background:var(--cream);line-height:1.6}
header{position:sticky;top:0;z-index:20;background:rgba(255,250,240,.96);backdrop-filter:blur(8px);border-bottom:1px solid #eadfbe}
.nav{max-width:1150px;margin:auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{height:68px;width:68px;object-fit:contain;border-radius:50%}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--green)}
.brand span{font-size:20px}
.navlinks{display:flex;gap:18px;flex-wrap:wrap}
.navlinks a{color:var(--dark);text-decoration:none;font-weight:700}
.hero{max-width:1150px;margin:auto;padding:45px 18px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:35px;align-items:center}
.badge{display:inline-block;background:#e7f1e9;color:var(--green);padding:7px 13px;border-radius:30px;font-weight:800;margin-bottom:14px}
h1{font-size:clamp(38px,6vw,68px);line-height:1.02;color:var(--green);margin-bottom:15px}
.hero h1 span{color:#9b7417}
.hero p{font-size:18px;max-width:650px;margin-bottom:22px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:800;border:2px solid var(--green);transition:.2s}
.btn.primary{background:var(--green);color:white}
.btn.secondary{color:var(--green);background:white}
.btn:hover{transform:translateY(-2px)}
.heroimg{width:100%;max-height:500px;object-fit:cover;border-radius:26px;box-shadow:0 15px 45px rgba(0,0,0,.13)}
.section{padding:55px 18px}
.container{max-width:1150px;margin:auto}
.title{text-align:center;color:var(--green);font-size:34px;margin-bottom:8px}
.subtitle{text-align:center;color:#68736b;margin-bottom:28px}
.prices{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{background:white;border:1px solid #e7dfc9;border-radius:18px;padding:22px 15px;text-align:center;box-shadow:0 8px 25px rgba(38,58,44,.07)}
.card strong{display:block;color:var(--green);font-size:25px}
.price{font-size:28px;font-weight:900;color:#9b7417;margin:5px 0 14px}
.order{display:block;background:var(--green);color:white;padding:10px;border-radius:10px;text-decoration:none;font-weight:800}
.note{margin:20px auto 0;max-width:750px;background:#fff3cf;border-left:5px solid var(--gold);padding:13px 16px;border-radius:10px;text-align:center}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feature{background:white;padding:25px;border-radius:18px;text-align:center;border:1px solid #e7dfc9}
.icon{font-size:35px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.gallery img{width:100%;height:230px;object-fit:cover;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.contact{background:var(--green);color:white;border-radius:25px;padding:35px;text-align:center}
.contact h2{font-size:32px;margin-bottom:8px}
.contact a{color:white}
footer{text-align:center;padding:25px 18px;color:#68736b}
.float{position:fixed;right:18px;bottom:18px;z-index:30;background:#1ca34a;color:white;padding:13px 17px;border-radius:50px;text-decoration:none;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.2)}
@media(max-width:850px){
 .hero{grid-template-columns:1fr;padding-top:30px}
 .prices{grid-template-columns:repeat(2,1fr)}
 .prices .card:last-child{grid-column:span 2}
 .features{grid-template-columns:1fr}
 .gallery{grid-template-columns:repeat(2,1fr)}
 .navlinks{display:none}
}
@media(max-width:480px){
 .prices{grid-template-columns:1fr}
 .prices .card:last-child{grid-column:auto}
 .gallery{grid-template-columns:1fr}
 .gallery img{height:260px}
}
</style>
</head>
